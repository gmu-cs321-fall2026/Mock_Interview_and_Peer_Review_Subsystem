<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Mock Interview Practice</h1>
    <label>Demo User ID: <input id="userId" type="number" value="101"></label>
</header>
<main>
    <section>
        <h2>Interview Questions</h2>
        <select id="category">
            <option value="">All</option>
            <option value="BEHAVIORAL">Behavioral</option>
            <option value="TECHNICAL">Technical</option>
            <option value="CASE">Case</option>
            <option value="INDUSTRY">Industry</option>
        </select>
        <div id="questions"></div>
    </section>
    <section>
        <div class="row">
            <h2>Open Practice Requests</h2>
            <button id="createRequest">Create Practice Request</button>
        </div>
        <div id="requests"></div>
    </section>
</main>
<p id="message"></p>
<script src="app.js"></script>
</body>
</html>
