<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Interview Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<!-- Shared page header and demo user switcher-->
<header>
    <button id="menuButton" class="menu-button" onclick="openNav()" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <h1>Mock Interview Practice</h1>
    <div class="user-area">
        <div id="userSwitcher" class="user-switcher"></div>
        <small id="currentUser"></small>
    </div>
</header>
<!-- Collapsible sidebar navigation (opened with the menu button in the header) -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeNav()"></div>
<nav id="mySidebar" class="sidebar" aria-label="Main navigation">
    <button class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    <a href="index.html">Questions</a>
    <a href="requests.html">Practice Requests</a>
    <a href="requestQuestion.html">Request a Question</a>
</nav>


<!-- Main interview question list and category filter-->
<main>
    <section>
        <h2>Interview Questions</h2>
 
        <select id="category">
            <option value="">All</option> 
            <option value="BEHAVIORAL">Behavioral</option>
            <option value="TECHNICAL">Technical</option>
            <option value="CASE">Case</option>
            <option value="INDUSTRY">Industry</option>
        </select>
        <a href="requestQuestion.html">Request Question to Add</a>
        <div id="questions"></div>
    </section>
</main>

<script src="app.js"></script>

</body>
</html>
