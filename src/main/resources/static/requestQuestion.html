<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Suggest Interview Question</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Shared page header and demo user switcher-->
<header>
    <button id="menuButton" class="menu-button" onclick="openNav()" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <h1>Mock Interview Practice</h1>
    <div class="user-area">
        <div id="userSwitcher" class="user-switcher"></div>
        <small id="currentUser"></small>
    </div>
</header>
<!-- Collapsible sidebar navigation (opened with the menu button in the header) -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeNav()"></div>
<nav id="mySidebar" class="sidebar" aria-label="Main navigation">
    <button class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    <a href="index.html">Questions</a>
    <a href="requests.html">Practice Requests</a>
    <a href="requestQuestion.html">Request a Question</a>
</nav>

<!-- Question submission form-->
<main>
    <section>
        <h2>Suggest a New Interview Question</h2>
        <div class="card">
            <label for="questionText">Question Text:</label><br>
            <textarea id="questionText" rows="3" style="width: 100%; margin-top: 5px; box-sizing: border-box;" placeholder="Enter question..."></textarea>
            <br><br>
            <label for="questionCategory">Category:</label><br>
            <select id="questionCategory" style="margin-top: 5px;">
                <option value="BEHAVIORAL">Behavioral</option>
                <option value="TECHNICAL">Technical</option>
                <option value="CASE">Case</option>
                <option value="INDUSTRY">Industry</option>
            </select>
            <br><br>
            <button id="submitQuestion">Submit Question</button>
        </div>
    </section>
    <!-- Only shown when the selected user is an admin-->
    <section id="adminOnly" style="display: none;">
        <h2>Requested Questions</h2>
        <div id="questionRequests"></div>
    </section>
</main>

<p id="message"></p>

<script src="app.js"></script>

</body>
</html>
