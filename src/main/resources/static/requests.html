<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice Requests</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Shared page header and demo user switcher-->
<header>
    <button id="menuButton" class="menu-button" onclick="openNav()" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <h1>Mock Interview Practice</h1>

    <div class="user-area">
        <div id="userSwitcher" class="user-switcher"></div>
        <small id="currentUser"></small>
    </div>

</header>
<!-- Collapsible sidebar navigation (opened with the menu button in the header) -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeNav()"></div>
<nav id="mySidebar" class="sidebar" aria-label="Main navigation">
    <button class="closebtn" onclick="closeNav()" aria-label="Close menu">&times;</button>
    <a href="index.html">Questions</a>
    <a href="requests.html">Practice Requests</a>
    <a href="requestQuestion.html">Request a Question</a>
</nav>


<main>
    <!-- Open requests that can be created or accepted-->
    <section>

        <div class="row">
            <h2>Open Practice Requests</h2>

            <button id="createRequest">
                Create Practice Request
            </button>
        </div>

        <div id="requests"></div>

    </section>
    <!-- Accepted pairings for the selected user-->
    <section>
        <div class="row">
            <h2>My Practice Partners</h2>

            <select id="pairingFilter">
                <option value="all">All</option>
                <option value="created">Requests I Made</option>
                <option value="accepted">Requests I Accepted</option>
            </select>
        </div>

        <div id="pairings"></div>
    </section>
    
    
</main>

<p id="message"></p>

<script src="app.js"></script>

</body>
</html>
